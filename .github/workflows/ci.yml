name: CI - Antigravity Guard

on:
  workflow_dispatch: # Permite disparo manual
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 🐍 Setup Python (for Antigravity Scripts)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📥 Clone Antigravity Kit
      run: |
        # Nosso projeto já tem scripts Antigravity customizados (.agent/)
        # Não precisamos clonar - usamos os scripts versionados no repo
        echo "✅ Usando scripts Antigravity versionados no repositório"
        echo "   (customizados para Next.js 15)"

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🛡️ Run Verify All (The Gatekeeper)
      # Roda sem URL (--no-e2e) porque no CI não temos servidor rodando ainda
      # O foco aqui é Segurança, Lint e Build
      run: python3 .agent/scripts/verify_all.py . --url http://localhost:3000 --no-e2e --stop-on-fail

    - name: 🚨 Wake Up Subagent on Failure
      if: failure()
      run: |
        echo "Acordando o subagent de correção..."
        curl -X POST "https://openclaw.marcuslinhares.com/hooks/agent" \
          -H "Authorization: Bearer ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "message": "🔧 **CI FAILURE - AUTO FIX**\n\n**Repo**: ${{ github.repository }}\n**Branch**: ${{ github.ref_name }}\n**Run ID**: ${{ github.run_id }}\n**Logs**: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}\n\nPlease:\n1. Clone the repo and checkout the failing branch\n2. Review the CI logs to identify the failure\n3. Fix the code issues\n4. Commit and push the fix\n5. Let me know when done",
            "name": "CI-AutoFix",
            "agentId": "ci-fixer",
            "model": "github-copilot/claude-sonnet-4.6",
            "deliver": true,
            "channel": "telegram",
            "to": "7727702465",
            "wakeMode": "now"
          }'

    - name: ✅ Notify PR Merger on Success (if PR)
      if: success() && github.event_name == 'pull_request'
      run: |
        echo "Notificando pr-merger sobre PR bem-sucedida..."
        curl -X POST "https://openclaw.marcuslinhares.com/hooks/agent" \
          -H "Authorization: Bearer ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "message": "📊 **PR PASSING - Ready for Merge**\n\n**Repo**: ${{ github.repository }}\n**PR Number**: ${{ github.event.pull_request.number }}\n**PR Title**: ${{ github.event.pull_request.title }}\n**Branch**: ${{ github.event.pull_request.head.ref }}\n**Commits**: ${{ github.event.pull_request.commits }}\n**Files Changed**: ${{ github.event.pull_request.changed_files }}\n**Additions**: ${{ github.event.pull_request.additions }}\n**Deletions**: ${{ github.event.pull_request.deletions }}\n**PR URL**: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}\n\nPlease review and merge if safe.",
            "name": "PR-Merge-Check",
            "agentId": "pr-merger",
            "model": "github-copilot/claude-sonnet-4.6",
            "deliver": true,
            "channel": "telegram",
            "to": "7727702465",
            "wakeMode": "now"
          }'

  docker-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Só gasta tempo de build no PR pra validar
    
    steps:
      - uses: actions/checkout@v4
      - name: 🐳 Build Docker Image
        run: docker build . -t mercadinho-connect:test
