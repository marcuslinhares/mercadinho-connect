name: CI - Antigravity Guard

on:
  workflow_dispatch: # Permite disparo manual
  push:
    branches: [ "main", "develop" ]
  pull_request:
    branches: [ "main", "develop" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 🐍 Setup Python (for Antigravity Scripts)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📥 Clone Antigravity Kit
      run: |
        # Nosso projeto já tem scripts Antigravity customizados (.agent/)
        # Não precisamos clonar - usamos os scripts versionados no repo
        echo "✅ Usando scripts Antigravity versionados no repositório"
        echo "   (customizados para Next.js 15)"

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🛡️ Run Verify All (The Gatekeeper)
      # Roda sem URL (--no-e2e) porque no CI não temos servidor rodando ainda
      # O foco aqui é Segurança, Lint e Build
      run: python3 .agent/scripts/verify_all.py . --url http://localhost:3000 --no-e2e --stop-on-fail

    - name: 🚨 Auto-Create Fix Card on CI Failure (Git Commit)
      if: failure() && github.event_name == 'pull_request'
      run: |
        # Setup git config for automated commits
        git config user.email "bot@openclaw.ai"
        git config user.name "CI Fix Card Bot"
        
        BRANCH="${{ github.event.pull_request.head.ref }}"
        PR_NUMBER="${{ github.event.pull_request.number }}"
        RUN_ID="${{ github.run_id }}"
        REPO="${{ github.repository }}"
        
        # Determine team based on branch name
        if echo "$BRANCH" | grep -q "US-1"; then
          TEAM="Frontend"
        elif echo "$BRANCH" | grep -q "US-2"; then
          TEAM="Backend"
        else
          TEAM="Dev"
        fi
        
        TIMESTAMP=$(date -u '+%Y-%m-%d %H:%M UTC')
        LOGS_URL="https://github.com/${REPO}/actions/runs/${RUN_ID}"
        
        # Create card content
        CARD=$(cat <<EOF

### [FIX-PR-${PR_NUMBER}] ${TEAM} CI Fix Required
- **PR**: #${PR_NUMBER}
- **Branch**: ${BRANCH}
- **Team**: ${TEAM}
- **Action**: Review logs → Fix code → git push
- **Logs**: ${LOGS_URL}
- **Status**: OPEN
- **Created**: ${TIMESTAMP}
EOF
)
        
        # Append to INBOX_DEVS.md (in root directory)
        cd ${{ github.workspace }}/..
        
        # Ensure file exists
        if [ ! -f INBOX_DEVS.md ]; then
          mkdir -p .
          cat > INBOX_DEVS.md << 'HEADER'
# 📋 INBOX_DEVS.md — Development Tasks

**Last Updated**: 2026-03-12 10:54 UTC

## 🎯 Active Cards (OPEN)

HEADER
        fi
        
        # Append card
        echo "$CARD" >> INBOX_DEVS.md
        
        # Commit and push to develop
        git add INBOX_DEVS.md
        git commit -m "card(ci-fix): auto-created PR #${PR_NUMBER} fix card [skip ci]" || echo "No changes to commit"
        git push origin develop || echo "Failed to push (may already be pushed)"
        
        echo "✅ Fix card added to INBOX_DEVS.md"
        echo "$CARD"
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

    - name: ✅ Notify PR Merger on Success (if PR)
      if: success() && github.event_name == 'pull_request'
      run: |
        echo "Notificando pr-merger sobre PR bem-sucedida..."
        curl -X POST "https://openclaw.marcuslinhares.com/hooks/agent" \
          -H "Authorization: Bearer ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "message": "📊 **PR PASSING - Ready for Merge**\n\n**Repo**: ${{ github.repository }}\n**PR Number**: ${{ github.event.pull_request.number }}\n**PR Title**: ${{ github.event.pull_request.title }}\n**Branch**: ${{ github.event.pull_request.head.ref }}\n**Commits**: ${{ github.event.pull_request.commits }}\n**Files Changed**: ${{ github.event.pull_request.changed_files }}\n**Additions**: ${{ github.event.pull_request.additions }}\n**Deletions**: ${{ github.event.pull_request.deletions }}\n**PR URL**: https://github.com/${{ github.repository }}/pull/${{ github.event.pull_request.number }}\n\nPlease review and merge if safe.",
            "name": "PR-Merge-Check",
            "agentId": "pr-merger",
            "model": "github-copilot/claude-sonnet-4.6",
            "deliver": true,
            "channel": "telegram",
            "to": "7727702465",
            "wakeMode": "now"
          }'

  docker-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Só gasta tempo de build no PR pra validar
    
    steps:
      - uses: actions/checkout@v4
      - name: 🐳 Build Docker Image
        run: docker build . -t mercadinho-connect:test
