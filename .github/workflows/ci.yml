name: CI - Antigravity Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 🐍 Setup Python (for Antigravity Scripts)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📥 Clone Antigravity Kit
      run: |
        # Nosso projeto já tem scripts Antigravity customizados (.agent/)
        # Não precisamos clonar - usamos os scripts versionados no repo
        echo "✅ Usando scripts Antigravity versionados no repositório"
        echo "   (customizados para Next.js 15)"

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🛡️ Run Verify All (The Gatekeeper)
      # Roda sem URL (--no-e2e) porque no CI não temos servidor rodando ainda
      # O foco aqui é Segurança, Lint e Build
      run: python3 .agent/scripts/verify_all.py . --url http://localhost:3000 --no-e2e --stop-on-fail

    - name: 🚨 Wake Up Subagent on Failure
      if: failure()
      run: |
        echo "Acordando o subagent de correção..."
        curl -X POST "https://openclaw.marcuslinhares.com/hooks/agent" \
          -H "Authorization: Bearer ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}" \
          -H "Content-Type: application/json" \
          -d '{
            "message": "🚨 CI falhou no repositório ${{ github.repository }} na branch ${{ github.ref_name }}. Run ID: ${{ github.run_id }}. Por favor, analise os logs e corrija o código.",
            "name": "CI-Failure",
            "agentId": "main",
            "deliver": true,
            "channel": "telegram",
            "to": "7727702465",
            "wakeMode": "now"
          }'

  docker-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Só gasta tempo de build no PR pra validar
    
    steps:
      - uses: actions/checkout@v4
      - name: 🐳 Build Docker Image
        run: docker build . -t mercadinho-connect:test
