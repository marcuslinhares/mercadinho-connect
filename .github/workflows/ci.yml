name: CI - Antigravity Guard

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    
    steps:
    - name: 📥 Checkout Code
      uses: actions/checkout@v4

    - name: 📦 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20
        cache: 'npm'

    - name: 🐍 Setup Python (for Antigravity Scripts)
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: 📥 Clone Antigravity Kit
      run: |
        rm -rf .agent
        git clone https://github.com/vudovn/antigravity-kit.git .agent
        pip install -r .agent/requirements.txt

    - name: 📦 Install Dependencies
      run: npm ci

    - name: 🛡️ Run Verify All (The Gatekeeper)
      # Roda sem URL (--no-e2e) porque no CI não temos servidor rodando ainda
      # O foco aqui é Segurança, Lint e Build
      run: python3 .agent/scripts/verify_all.py . --url http://localhost:3000 --no-e2e --stop-on-fail

    - name: 🚨 Wake Up Subagent on Failure
      if: failure()
      run: |
        echo "Acordando o subagent de correção..."
        curl -X POST "${{ secrets.OPENCLAW_WEBHOOK_URL }}" \
          -H "Content-Type: application/json" \
          -d '{"event": "ci_failure", "repo": "${{ github.repository }}", "branch": "${{ github.ref_name }}", "run_id": "${{ github.run_id }}"}'

  docker-build:
    needs: quality-gate
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' # Só gasta tempo de build no PR pra validar
    
    steps:
      - uses: actions/checkout@v4
      - name: 🐳 Build Docker Image
        run: docker build . -t mercadinho-connect:test
