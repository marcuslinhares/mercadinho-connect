name: Deploy Staging - Docker + GHCR + VPS

on:
  push:
    branches: [ "develop" ]
  workflow_dispatch: # Permite disparo manual para emergências

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  IMAGE_TAG: staging
  VPS_HOST: 204.12.199.113
  VPS_USER: administrator
  VPS_DEPLOY_PATH: /opt/mercadinho-connect
  CONTAINER_NAME: mercadinho-connect-staging
  CONTAINER_PORT: 3000

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 📦 Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 🔐 Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 🏗️ Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }}
            NEXT_PUBLIC_STRIPE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_KEY }}
            NEXT_PUBLIC_SUPABASE_URL=${{ secrets.SUPABASE_URL }}
            NEXT_PUBLIC_SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }}

  deploy-to-vps:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Code
        uses: actions/checkout@v4

      - name: 🚀 Deploy to VPS via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ env.VPS_HOST }}
          username: ${{ env.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          port: 22
          script: |
            set -e
            
            echo "🔄 Iniciando deploy do staging..."
            
            # 1. Criar diretório se não existir
            mkdir -p ${{ env.VPS_DEPLOY_PATH }}
            cd ${{ env.VPS_DEPLOY_PATH }}
            
            # 2. Autenticar no GHCR
            echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin
            
            # 3. Pull da nova imagem
            echo "📥 Fazendo pull da imagem staging..."
            docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # 4. Parar o container antigo (se existir)
            if docker ps -a --format '{{.Names}}' | grep -q '^${{ env.CONTAINER_NAME }}$'; then
              echo "🛑 Parando container antigo..."
              docker stop ${{ env.CONTAINER_NAME }} || true
              docker rm ${{ env.CONTAINER_NAME }} || true
            fi
            
            # 5. Iniciar novo container
            echo "🚀 Iniciando novo container..."
            docker run -d \
              --name ${{ env.CONTAINER_NAME }} \
              --restart unless-stopped \
              -p 3000:${{ env.CONTAINER_PORT }} \
              -e NODE_ENV=production \
              -e NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_STAGING }} \
              -e NEXT_PUBLIC_STRIPE_KEY=${{ secrets.NEXT_PUBLIC_STRIPE_KEY }} \
              -e STRIPE_SECRET_KEY=${{ secrets.STRIPE_SECRET_KEY }} \
              -e STRIPE_WEBHOOK_SECRET=${{ secrets.STRIPE_WEBHOOK_SECRET }} \
              -e DATABASE_URL=${{ secrets.DATABASE_URL_STAGING }} \
              -e SUPABASE_URL=${{ secrets.SUPABASE_URL }} \
              -e SUPABASE_ANON_KEY=${{ secrets.SUPABASE_ANON_KEY }} \
              -e SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }} \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ env.IMAGE_TAG }}
            
            # 6. Aguardar container estar saudável
            echo "⏳ Aguardando container estar pronto..."
            sleep 10
            
            # 7. Verificação de saúde básica
            if ! docker ps | grep -q ${{ env.CONTAINER_NAME }}; then
              echo "❌ Container falhou ao iniciar!"
              docker logs ${{ env.CONTAINER_NAME }}
              exit 1
            fi
            
            echo "✅ Container iniciado com sucesso!"
            
            # 8. Limpar imagens antigas
            docker image prune -f --filter "dangling=true"
            
            echo "🎉 Deploy concluído com sucesso!"

  notify-on-success:
    needs: deploy-to-vps
    runs-on: ubuntu-latest
    if: success()

    steps:
      - name: 📢 Notify Slack/Telegram on Success
        run: |
          echo "✅ Deploy para staging concluído com sucesso!"
          echo "🌐 Acesse em: https://dev-mercadinho.marcuslinhares.com"
          echo "📊 Monitorar em tempo real: docker logs -f ${{ env.CONTAINER_NAME }}"

      - name: 🤖 Invoke QA via OpenClaw Webhook
        run: |
          echo "Disparando QA Agent no OpenClaw para reteste..."
          curl -X POST https://openclaw.marcuslinhares.com/hooks/agent \
            -H 'Authorization: Bearer ${{ secrets.OPENCLAW_WEBHOOK_TOKEN }}' \
            -H 'Content-Type: application/json' \
            -d '{
              "message": "Deploy concluído no staging! Por favor, realize os testes do Mercadinho Boost feature no ambiente de staging: https://dev-mercadinho.marcuslinhares.com. Verifique se o app está respondendo e se a feature funciona.",
              "name": "QA Retest (Staging Deploy)",
              "agentId": "qa",
              "wakeMode": "now"
            }'

  notify-on-failure:
    needs: deploy-to-vps
    runs-on: ubuntu-latest
    if: failure()

    steps:
      - name: 🚨 Notify on Failure
        run: |
          echo "❌ Deploy falhou! Verifique os logs acima."
          exit 1
